import.taxonomy.step1.desc=<p>\u0395\u03af\u03bd\u03b1\u03b9 \u03ba\u03c1\u03af\u03c3\u03b9\u03bc\u03bf \u03bd\u03b1 \u03b4\u03b9\u03b1\u03c4\u03b7\u03c1\u03ae\u03c3\u03b5\u03c4\u03b5 \u03c4\u03b9\u03c2 \u03c3\u03c4\u03ae\u03bb\u03b5\u03c2 \u03cc\u03c0\u03c9\u03c2 \u03c6\u03b1\u03af\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9. \u0391\u03c5\u03c4\u03ad\u03c2 \u03c0\u03bf\u03c5 \u03c3\u03b7\u03bc\u03b5\u03b9\u03ce\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03bc\u03b5 \u03b1\u03c3\u03c4\u03b5\u03c1\u03af\u03c3\u03ba\u03bf \u03b5\u03af\u03bd\u03b1\u03b9 \u03c5\u03c0\u03bf\u03c7\u03c1\u03b5\u03c9\u03c4\u03b9\u03ba\u03ad\u03c2\:</p><p><ul><li><strong>\u0394\u03b9\u03b1\u03b4\u03c1\u03bf\u03bc\u03ae *</strong></li><li><strong>\u0395\u03be\u03c9\u03c4. \u03b1\u03bd\u03b1\u03c6. *</strong></li><li>\u03a4\u03cd\u03c0\u03bf\u03c2</li><li>\u03a3\u03b5\u03b9\u03c1\u03ac</li><li><strong>\u0393\u03bb\u03ce\u03c3\u03c3\u03b1 *</strong></li><li><strong>\u03a4\u03af\u03c4\u03bb\u03bf\u03c2 *</strong></li><li>\u03a0\u03b5\u03c1\u03b9\u03b3\u03c1\u03b1\u03c6\u03ae</li></ul></p><p>\u03a0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03ce \u03bb\u03ac\u03b2\u03b5\u03c4\u03b5 \u03c5\u03c0\u03cc\u03c8\u03b7 \u03cc\u03c4\u03b9, \u03b5\u03ac\u03bd \u03b8\u03ad\u03bb\u03b5\u03c4\u03b5 \u03bd\u03b1 \u03b5\u03b9\u03c3\u03b1\u03b3\u03ac\u03b3\u03b5\u03c4\u03b5 \u03b5\u03c0\u03af\u03c0\u03b5\u03b4\u03b1 \u03c4\u03b1\u03be\u03b9\u03bd\u03cc\u03bc\u03b7\u03c3\u03b7\u03c2 \u03c0\u03bf\u03c5 \u03b5\u03af\u03bd\u03b1\u03b9 \u03b8\u03c5\u03b3\u03b1\u03c4\u03c1\u03b9\u03ba\u03ac \u03ac\u03bb\u03bb\u03c9\u03bd, \u03c4\u03bf \u03b3\u03bf\u03bd\u03b9\u03ba\u03cc \u03b5\u03c0\u03af\u03c0\u03b5\u03b4\u03bf \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03b5\u03af\u03c4\u03b5 \u03bd\u03b1 \u03c5\u03c0\u03ac\u03c1\u03c7\u03b5\u03b9 \u03ae\u03b4\u03b7 \u03b5\u03af\u03c4\u03b5 \u03bd\u03b1 \u03b5\u03b9\u03c3\u03ac\u03b3\u03b5\u03c4\u03b1\u03b9 \u03c3\u03b5 \u03c0\u03c1\u03bf\u03b7\u03b3\u03bf\u03cd\u03bc\u03b5\u03bd\u03b7 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ae \u03b1\u03c0\u03cc \u03c4\u03bf \u03b8\u03c5\u03b3\u03b1\u03c4\u03c1\u03b9\u03ba\u03cc. \u0395\u03af\u03bd\u03b1\u03b9 \u03c7\u03c1\u03ae\u03c3\u03b9\u03bc\u03bf \u03bd\u03b1 \u03c4\u03b1\u03be\u03b9\u03bd\u03bf\u03bc\u03ae\u03c3\u03b5\u03c4\u03b5 \u03c4\u03b1 \u03b4\u03b5\u03b4\u03bf\u03bc\u03ad\u03bd\u03b1 \u03b5\u03b9\u03c3\u03b1\u03b3\u03c9\u03b3\u03ae\u03c2 \u03c3\u03b1\u03c2 \u03b1\u03bd\u03ac \u03b4\u03b9\u03b1\u03b4\u03c1\u03bf\u03bc\u03ae.</p>
